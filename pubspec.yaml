name: pibro
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  flutter_svg: ^2.0.17
  another_flutter_splash_screen: ^1.2.1
  flutter_dotenv: ^5.2.1
  get_storage: ^2.1.1
  logger: ^2.5.0
  http: ^1.3.0
  encrypt: ^5.0.3
  intl: ^0.20.2
  loading_animation_widget: ^1.3.0
  carousel_slider: ^5.0.0
  flutter_inappwebview: ^6.1.5
  printing: ^5.14.2
  pdf: ^3.11.3
  universal_html: ^2.2.4
  universal_io: ^2.2.2
  mime: ^2.0.0
  open_filex: ^4.7.0
  # document_file_save_plus: ^2.0.0
  path_provider: ^2.1.5
  file_picker: ^10.1.2
  dotted_border: ^2.1.0
  url_launcher: ^6.3.1
  flutter_tawkto: ^0.0.5
  font_awesome_flutter: ^10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/env/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Black.ttf
        - asset: assets/fonts/Poppins-BlackItalic.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins-BoldItalic.ttf
        - asset: assets/fonts/Poppins-ExtraBold.ttf
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
        - asset: assets/fonts/Poppins-ExtraLight.ttf
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
        - asset: assets/fonts/Poppins-Italic.ttf
        - asset: assets/fonts/Poppins-Light.ttf
        - asset: assets/fonts/Poppins-LightItalic.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-MediumItalic.ttf
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
        - asset: assets/fonts/Poppins-Thin.ttf
        - asset: assets/fonts/Poppins-ThinItalic.ttf
          weight: 400